defaults:
  - model/share@share
  - model/view_generator@view_generator
  - model/extractor@extractor
  - model/sqtd@global_decoder
  - model/decoder@decoder
  - transform/pretrain@transform
  - _self_

_target_: morphcell.model.PQAEPretrain

# Match the trainable spherical template used by PQAEv3.
global_decoder:
  optimize_template: true

optimizer_cfg:
  lr: 5e-4
  min_lr: 1e-6
  epochs: 300
  weight_decay: 0.05
  warmup_epochs: 10
  warmup_lr_init: 1e-6
  unfreeze_extractor_epoch: 0

loss_weights:
  cross: 1.0  # Historical key; weights the configured patch reconstruction loss.
  self: 0.5

reconstruction_strategy: direct
enable_self_reconstruction: true
resume_ckpt_path: null
pretrained_ckpt_path: null
